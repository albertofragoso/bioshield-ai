# Production stack — Hetzner CAX11 (ARM) + Cloudflare Tunnel
# SQLite for demo; swap to Postgres by changing DATABASE_URL in .env.prod.
# Usage: make up  (or: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build)
#
# RAM budget (~900MB idle on 4GB CAX11):
#   backend (bge-small loaded) ~500MB | frontend ~150MB | nginx ~30MB
#   chromadb ~100MB | cloudflared ~50MB | promtail ~40MB | OS ~150MB

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./data/chroma_db:/data/chroma_db
      - ./data/sqlite:/app/data
    deploy:
      resources:
        limits:
          memory: 700M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env.prod
    deploy:
      resources:
        limits:
          memory: 250M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
