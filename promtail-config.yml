# Promtail config — ships Docker container logs to Grafana Cloud Loki
# Required env vars in .env.prod:
#   GRAFANA_LOKI_URL   e.g. https://logs-prod-012.grafana.net
#   GRAFANA_USER       numeric user ID from Grafana Cloud
#   GRAFANA_API_KEY    Grafana Cloud API key with logs:write scope

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${GRAFANA_LOKI_URL}/loki/api/v1/push
    basic_auth:
      username: ${GRAFANA_USER}
      password: ${GRAFANA_API_KEY}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            msg: msg
            request_id: request_id
      - labels:
          level:
          service:
