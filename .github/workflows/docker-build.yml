name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  workflow_dispatch: {}

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Next.js standalone output
        run: |
          grep -q "standalone" frontend/next.config.js \
            || grep -q "standalone" frontend/next.config.ts \
            || (echo "ERROR: next.config missing output: standalone" && exit 1)

  build-backend:
    runs-on: ubuntu-latest
    needs: validate-config
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Cache writes need packages:write, which forked PRs don't get — skip login there
      # and let cache-to resolve to '' (build still runs, just without pushing new cache).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=registry,ref=ghcr.io/albertofragoso/bioshield-ai/backend-cache
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/albertofragoso/bioshield-ai/backend-cache,mode=max' || '' }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: validate-config
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=registry,ref=ghcr.io/albertofragoso/bioshield-ai/frontend-cache
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/albertofragoso/bioshield-ai/frontend-cache,mode=max' || '' }}
